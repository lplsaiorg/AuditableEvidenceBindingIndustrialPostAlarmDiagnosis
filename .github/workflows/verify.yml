name: Verify reference implementation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/verify_manuscript_package.py
      - run: aeb-diagnose run --config configs/demo.toml --input examples/demo-event.json --run-dir runs/ci-rules --backend rules
      - run: aeb-diagnose verify --config configs/demo.toml --run-dir runs/ci-rules
      - run: aeb-diagnose run --config configs/demo.toml --input examples/demo-event.json --run-dir runs/ci-safe --backend safe
